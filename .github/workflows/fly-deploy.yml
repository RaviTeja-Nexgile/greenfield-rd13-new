name: CI and Fly.io deploy

# Runs on every push to main and on every pull request: the test job is the check
# to require in branch protection. The deploy jobs run only on main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: "Also deploy to production (still waits for a required reviewer)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fly-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # unchecked (from memory)
      - uses: actions/setup-node@v4 # unchecked (from memory)
        with:
          node-version-file: package.json # "engines": ">=22"
          cache: npm
      - run: npm ci
      - run: npm test

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4 # unchecked (from memory)
      # Third-party action: pin the full commit SHA of a checked release before relying on it.
      - uses: aquasecurity/trivy-action@0.28.0 # unchecked (from memory); SHA still to be pinned
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  deploy-staging:
    name: Deploy to Fly.io (staging)
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: fly-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # unchecked (from memory)
      # Third-party action: pin the full commit SHA of a checked release before relying on it.
      - uses: superfly/flyctl-actions/setup-flyctl@master # unchecked (from memory); SHA still to be pinned
      # The token comes from the "staging" environment secret FLY_API_TOKEN; it is never written here.
      - run: flyctl deploy --remote-only --config fly.toml --app leave-tracker-new-staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-production:
    # Never automatic: runs only when someone starts this workflow by hand with
    # deploy_production checked, AND a required reviewer approves the "production"
    # environment. The person must add the reviewers (Settings -> Environments ->
    # production -> Required reviewers); some plans do not offer them for private
    # repositories, and then the manual trigger is the only gate.
    name: Deploy to Fly.io (production)
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deploy_production
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: fly-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4 # unchecked (from memory)
      # Third-party action: pin the full commit SHA of a checked release before relying on it.
      - uses: superfly/flyctl-actions/setup-flyctl@master # unchecked (from memory); SHA still to be pinned
      # The token comes from the "production" environment secret FLY_API_TOKEN; it is never written here.
      # Rollback: `flyctl releases` lists past versions, `flyctl deploy --image <previous image>`
      # or `flyctl releases rollback` returns to the last good one.
      - run: flyctl deploy --remote-only --config fly.toml --app leave-tracker-new
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
